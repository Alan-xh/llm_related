<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">Transformer Seq2Seq 注意力与因果掩码</title>
  <desc id="desc">展示编码器自注意力、解码器因果自注意力、交叉注意力的数据流，以及解码器上三角遮罩。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#315b78"/>
    </marker>
    <style>
      .sans { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif; }
      .title { font-size: 34px; font-weight: 700; fill: #fff; }
      .section { font-size: 22px; font-weight: 700; fill: #123b56; }
      .label { font-size: 18px; font-weight: 700; fill: #123b56; }
      .body { font-size: 16px; fill: #314b5c; }
      .small { font-size: 14px; fill: #526b78; }
      .box { stroke: #315b78; stroke-width: 2; rx: 10; }
      .arrow { stroke: #315b78; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .cell { stroke: #fff; stroke-width: 1; }
    </style>
  </defs>
  <rect width="1600" height="940" fill="#f7fafb"/>
  <rect width="1600" height="88" fill="#123b56"/>
  <text x="52" y="57" class="sans title">Transformer Seq2Seq：注意力路径与因果掩码</text>
  <text x="1548" y="54" text-anchor="end" class="sans small" fill="#d8edf0">Q / K / V · Encoder–Decoder</text>

  <text x="72" y="132" class="sans section">编码器：源序列的双向自注意力</text>
  <rect x="72" y="158" width="250" height="58" class="box" fill="#d8edf0"/>
  <text x="197" y="193" text-anchor="middle" class="sans label">源 Token + 位置编码</text>
  <path d="M322 187 H410" class="arrow"/>
  <rect x="410" y="148" width="310" height="78" class="box" fill="#c9e7e2"/>
  <text x="565" y="180" text-anchor="middle" class="sans label">Multi-Head Self-Attention</text>
  <text x="565" y="204" text-anchor="middle" class="sans small">Q = K = V = 源序列</text>
  <path d="M720 187 H808" class="arrow"/>
  <rect x="808" y="148" width="250" height="78" class="box" fill="#e5f0d5"/>
  <text x="933" y="180" text-anchor="middle" class="sans label">FFN + 残差 + LN</text>
  <text x="933" y="204" text-anchor="middle" class="sans small">重复 N 层 → Memory</text>
  <path d="M1058 187 H1160 V370" class="arrow"/>
  <rect x="1080" y="372" width="230" height="62" class="box" fill="#e5f0d5"/>
  <text x="1195" y="410" text-anchor="middle" class="sans label">Encoder Memory</text>

  <text x="72" y="306" class="sans section">解码器：只能读取已生成的目标 Token</text>
  <rect x="72" y="334" width="250" height="58" class="box" fill="#f6e2bd"/>
  <text x="197" y="369" text-anchor="middle" class="sans label">右移目标 Token + PE</text>
  <path d="M322 363 H410" class="arrow"/>
  <rect x="410" y="322" width="310" height="82" class="box" fill="#f2cfb1"/>
  <text x="565" y="355" text-anchor="middle" class="sans label">Masked Self-Attention</text>
  <text x="565" y="380" text-anchor="middle" class="sans small">Q = K = V = 目标序列</text>
  <path d="M720 363 H808" class="arrow"/>
  <rect x="808" y="322" width="300" height="82" class="box" fill="#c9e7e2"/>
  <text x="958" y="355" text-anchor="middle" class="sans label">Cross-Attention</text>
  <text x="958" y="380" text-anchor="middle" class="sans small">Q = Decoder，K/V = Memory</text>
  <path d="M1108 363 H1278" class="arrow"/>
  <rect x="1278" y="322" width="230" height="82" class="box" fill="#e5f0d5"/>
  <text x="1393" y="355" text-anchor="middle" class="sans label">Linear Head</text>
  <text x="1393" y="380" text-anchor="middle" class="sans small">[B, S_tgt, Vocab]</text>
  <path d="M1195 434 V520 H958 V406" class="arrow"/>
  <text x="1060" y="510" class="sans small">Memory 作为 K、V 注入每层解码器</text>

  <text x="72" y="570" class="sans section">因果注意力矩阵（上三角为 -∞）</text>
  <text x="460" y="604" class="sans label">Query 位置 →</text>
  <text x="260" y="646" class="sans label">Key 位置 ↓</text>
  <g transform="translate(500 620)">
    <rect x="0" y="0" width="56" height="56" class="cell" fill="#4c9a9a"/><rect x="56" y="0" width="56" height="56" class="cell" fill="#e8eef0"/><rect x="112" y="0" width="56" height="56" class="cell" fill="#e8eef0"/><rect x="168" y="0" width="56" height="56" class="cell" fill="#e8eef0"/>
    <rect x="0" y="56" width="56" height="56" class="cell" fill="#4c9a9a"/><rect x="56" y="56" width="56" height="56" class="cell" fill="#4c9a9a"/><rect x="112" y="56" width="56" height="56" class="cell" fill="#e8eef0"/><rect x="168" y="56" width="56" height="56" class="cell" fill="#e8eef0"/>
    <rect x="0" y="112" width="56" height="56" class="cell" fill="#4c9a9a"/><rect x="56" y="112" width="56" height="56" class="cell" fill="#4c9a9a"/><rect x="112" y="112" width="56" height="56" class="cell" fill="#4c9a9a"/><rect x="168" y="112" width="56" height="56" class="cell" fill="#e8eef0"/>
    <rect x="0" y="168" width="56" height="56" class="cell" fill="#4c9a9a"/><rect x="56" y="168" width="56" height="56" class="cell" fill="#4c9a9a"/><rect x="112" y="168" width="56" height="56" class="cell" fill="#4c9a9a"/><rect x="168" y="168" width="56" height="56" class="cell" fill="#4c9a9a"/>
    <text x="28" y="245" text-anchor="middle" class="sans small">1</text><text x="84" y="245" text-anchor="middle" class="sans small">2</text><text x="140" y="245" text-anchor="middle" class="sans small">3</text><text x="196" y="245" text-anchor="middle" class="sans small">4</text>
    <text x="28" y="36" text-anchor="middle" class="sans small" fill="#fff">可见</text><text x="84" y="36" text-anchor="middle" class="sans small">屏蔽</text>
  </g>
  <text x="790" y="665" class="sans body">允许位置 i 关注 1…i，未来位置 j&gt;i 加上 -∞。</text>
  <text x="790" y="700" class="sans body">softmax 后对应权重为 0，保证训练时不窥探未来。</text>
  <text x="790" y="755" class="sans label">Attention(Q,K,V) = softmax(QKᵀ / √dₖ + M)V</text>
  <text x="790" y="790" class="sans small">颜色：绿色 = 可见连接　灰色 = 被 mask 的连接</text>
</svg>
