<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">条件生成模型的三种数据流</title>
  <desc id="desc">并列展示条件 DDPM、条件 Flow Matching 和条件 CVAE 如何使用时间、类别或控制序列生成样本。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#315b78"/></marker>
    <style>
      .font{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif}
      .title{font-size:30px;font-weight:700;fill:#fff}.lane{font-size:21px;font-weight:700;fill:#123b56}
      .body{font-size:16px;fill:#314b5c}.small{font-size:14px;fill:#526b78}.formula{font-size:15px;font-family:Arial,sans-serif;fill:#526b78}
    </style>
  </defs>
  <rect width="1200" height="780" fill="#f7fafb"/>
  <rect width="1200" height="78" fill="#123b56"/>
  <text x="40" y="50" class="font title">条件生成：同一个条件信号，三种生成路径</text>
  <text x="40" y="108" class="font small">条件可以是类别 y、时间步 t，或整段控制序列 c；模型据此限制生成分布。</text>

  <rect x="30" y="130" width="1140" height="175" rx="14" fill="#fff" stroke="#d7e4e9" stroke-width="2"/>
  <text x="52" y="162" class="font lane">Conditional DDPM：逐步去噪</text>
  <rect x="55" y="190" width="135" height="65" rx="10" fill="#d9eef0" stroke="#6d9baa" stroke-width="2"/>
  <text x="122" y="217" text-anchor="middle" class="font body">x₀ + 噪声 ε</text><text x="122" y="241" text-anchor="middle" class="formula">q_sample(t)</text>
  <path d="M200 222H260" stroke="#315b78" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="270" y="190" width="145" height="65" rx="10" fill="#fff0e6" stroke="#ee8d4f" stroke-width="2"/>
  <text x="342" y="217" text-anchor="middle" class="font body">含噪图像 xₜ</text><text x="342" y="241" text-anchor="middle" class="formula">[B, C, H, W]</text>
  <path d="M425 222H490" stroke="#315b78" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="500" y="180" width="250" height="85" rx="10" fill="#e9e4f7" stroke="#8675b3" stroke-width="2"/>
  <text x="625" y="211" text-anchor="middle" class="font body">条件 U-Net / DiT</text><text x="625" y="237" text-anchor="middle" class="formula">ε̂θ(xₜ, t, y)</text><text x="625" y="258" text-anchor="middle" class="font small">预测噪声</text>
  <path d="M760 222H825" stroke="#315b78" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="835" y="190" width="145" height="65" rx="10" fill="#fff0e6" stroke="#ee8d4f" stroke-width="2"/>
  <text x="907" y="217" text-anchor="middle" class="font body">xₜ₋₁</text><text x="907" y="241" text-anchor="middle" class="font small">重复 T 步</text>
  <path d="M990 222H1050" stroke="#315b78" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1060" y="190" width="90" height="65" rx="10" fill="#d9eef0" stroke="#6d9baa" stroke-width="2"/>
  <text x="1105" y="228" text-anchor="middle" class="font body">生成 x̂</text>

  <rect x="30" y="325" width="1140" height="175" rx="14" fill="#fff" stroke="#d7e4e9" stroke-width="2"/>
  <text x="52" y="357" class="font lane">Conditional Flow Matching：沿向量场积分</text>
  <rect x="55" y="385" width="145" height="65" rx="10" fill="#d9eef0" stroke="#6d9baa" stroke-width="2"/>
  <text x="127" y="412" text-anchor="middle" class="font body">高斯噪声 x₀</text><text x="127" y="436" text-anchor="middle" class="font small">类别 y, t=0</text>
  <path d="M210 417H280" stroke="#315b78" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="290" y="375" width="240" height="85" rx="10" fill="#fff0e6" stroke="#ee8d4f" stroke-width="2"/>
  <text x="410" y="406" text-anchor="middle" class="font body">向量场网络</text><text x="410" y="432" text-anchor="middle" class="formula">vθ(xₜ, t, y) ≈ x₁ − x₀</text><text x="410" y="452" text-anchor="middle" class="font small">预测移动方向</text>
  <path d="M540 417H610" stroke="#315b78" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="620" y="375" width="270" height="85" rx="10" fill="#e9e4f7" stroke="#8675b3" stroke-width="2"/>
  <text x="755" y="406" text-anchor="middle" class="font body">Euler ODE 步进</text><text x="755" y="432" text-anchor="middle" class="formula">x ← x + vθ · Δt</text><text x="755" y="452" text-anchor="middle" class="font small">约 50 步从 t=0 到 1</text>
  <path d="M900 417H970" stroke="#315b78" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="980" y="385" width="170" height="65" rx="10" fill="#d9eef0" stroke="#6d9baa" stroke-width="2"/>
  <text x="1065" y="412" text-anchor="middle" class="font body">条件样本 x₁</text><text x="1065" y="436" text-anchor="middle" class="font small">q(x₁ | y)</text>

  <rect x="30" y="520" width="1140" height="210" rx="14" fill="#fff" stroke="#d7e4e9" stroke-width="2"/>
  <text x="52" y="552" class="font lane">Conditional VAE：在条件下采样潜变量</text>
  <rect x="55" y="585" width="145" height="65" rx="10" fill="#d9eef0" stroke="#6d9baa" stroke-width="2"/>
  <text x="127" y="612" text-anchor="middle" class="font body">序列 x 与条件 c</text><text x="127" y="636" text-anchor="middle" class="font small">拼接输入</text>
  <path d="M210 617H275" stroke="#315b78" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="285" y="575" width="190" height="85" rx="10" fill="#fff0e6" stroke="#ee8d4f" stroke-width="2"/>
  <text x="380" y="606" text-anchor="middle" class="font body">BiLSTM Encoder</text><text x="380" y="632" text-anchor="middle" class="font small">μ, logσ²</text><text x="380" y="651" text-anchor="middle" class="formula">z = μ + σ ⊙ ε</text>
  <path d="M485 617H550" stroke="#315b78" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="560" y="575" width="220" height="85" rx="10" fill="#e9e4f7" stroke="#8675b3" stroke-width="2"/>
  <text x="670" y="606" text-anchor="middle" class="font body">拼接 z 与首帧条件 c₀</text><text x="670" y="635" text-anchor="middle" class="font small">初始化解码器状态</text>
  <path d="M790 617H855" stroke="#315b78" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="865" y="575" width="170" height="85" rx="10" fill="#fff0e6" stroke="#ee8d4f" stroke-width="2"/>
  <text x="950" y="606" text-anchor="middle" class="font body">UniLSTM Decoder</text><text x="950" y="635" text-anchor="middle" class="font small">完整条件 C 驱动</text>
  <path d="M1045 617H1100" stroke="#315b78" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1110" y="585" width="40" height="65" rx="8" fill="#d9eef0" stroke="#6d9baa" stroke-width="2"/>
  <text x="1130" y="622" text-anchor="middle" class="font body">x̂</text>
  <text x="55" y="704" class="font small">共同点：条件进入模型后，生成分布从 p(x) 变为 p(x | condition)；区别在于去噪、ODE 积分或潜变量解码路径。</text>
</svg>
