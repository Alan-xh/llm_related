<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">DDPM forward noising and reverse denoising</title>
  <desc id="desc">Forward diffusion gradually adds Gaussian noise. A learned reverse process removes the noise one step at a time.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef5ff"/></linearGradient>
    <linearGradient id="clean" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4f8cff"/><stop offset="1" stop-color="#2354c7"/></linearGradient>
    <linearGradient id="noise" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#64748b"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#059669"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#64748b" flood-opacity=".2"/></filter>
    <style>
      .title{font:700 26px system-ui,sans-serif;fill:#0f172a}.subtitle{font:500 15px system-ui,sans-serif;fill:#475569}
      .label{font:700 16px system-ui,sans-serif;fill:#0f172a}.small{font:500 13px system-ui,sans-serif;fill:#475569}
      .lane{font:700 17px system-ui,sans-serif;fill:#1e3a8a}.lane2{font:700 17px system-ui,sans-serif;fill:#065f46}
    </style>
  </defs>
  <rect width="1200" height="620" rx="18" fill="url(#bg)"/>
  <text x="52" y="48" class="title">DDPM: the same data path viewed in two directions</text>
  <text x="52" y="75" class="subtitle">Forward diffusion is fixed; the neural network learns the reverse denoising transitions.</text>
  <rect x="42" y="105" width="1116" height="210" rx="16" fill="#fff" stroke="#bfdbfe" stroke-width="2" filter="url(#shadow)"/>
  <text x="68" y="137" class="lane">Forward process q: add Gaussian noise</text>
  <text x="68" y="162" class="small">xₜ = √ᾱₜ x₀ + √(1−ᾱₜ) ε</text>
  <g transform="translate(76,188)">
    <rect width="132" height="92" rx="12" fill="url(#clean)"/><text x="66" y="120" text-anchor="middle" class="label">x₀ · clean data</text>
    <path d="M150 46 H238" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/><text x="194" y="29" text-anchor="middle" class="small">small βₜ</text>
    <rect x="258" width="132" height="92" rx="12" fill="#628fe5"/><circle cx="281" cy="27" r="3" fill="#dbeafe"/><circle cx="332" cy="57" r="4" fill="#e0f2fe"/><circle cx="366" cy="19" r="3" fill="#dbeafe"/><text x="324" y="120" text-anchor="middle" class="label">x₁</text>
    <path d="M408 46 H496" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/><text x="452" y="29" text-anchor="middle" class="small">repeat T steps</text>
    <rect x="516" width="132" height="92" rx="12" fill="#64748b"/><g fill="#cbd5e1"><circle cx="538" cy="21" r="4"/><circle cx="565" cy="66" r="3"/><circle cx="598" cy="30" r="4"/><circle cx="620" cy="56" r="3"/><circle cx="634" cy="14" r="3"/><circle cx="548" cy="47" r="2"/></g><text x="582" y="120" text-anchor="middle" class="label">xₜ ≈ N(0,I)</text>
  </g>
  <rect x="42" y="340" width="1116" height="210" rx="16" fill="#fff" stroke="#a7f3d0" stroke-width="2" filter="url(#shadow)"/>
  <text x="68" y="372" class="lane2">Reverse process pθ: predict noise and denoise</text>
  <text x="68" y="397" class="small">εθ(xₜ,t) → μθ(xₜ,t), then sample xₜ₋₁</text>
  <g transform="translate(76,423)">
    <rect width="132" height="92" rx="12" fill="url(#noise)"/><g fill="#cbd5e1"><circle cx="22" cy="31" r="4"/><circle cx="54" cy="71" r="3"/><circle cx="91" cy="38" r="4"/><circle cx="116" cy="68" r="3"/><circle cx="72" cy="20" r="2"/></g><text x="66" y="120" text-anchor="middle" class="label">xₜ</text>
    <path d="M150 46 H238" stroke="#059669" stroke-width="3" marker-end="url(#arrowGreen)"/><text x="194" y="29" text-anchor="middle" class="small">εθ(xₜ,t)</text>
    <rect x="258" width="132" height="92" rx="12" fill="#6b8fcb"/><circle cx="283" cy="43" r="3" fill="#dbeafe"/><circle cx="343" cy="79" r="3" fill="#dbeafe"/><circle cx="367" cy="25" r="2" fill="#dbeafe"/><text x="324" y="120" text-anchor="middle" class="label">xₜ₋₁</text>
    <path d="M408 46 H496" stroke="#059669" stroke-width="3" marker-end="url(#arrowGreen)"/><text x="452" y="29" text-anchor="middle" class="small">repeat T steps</text>
    <rect x="516" width="132" height="92" rx="12" fill="url(#clean)"/><text x="582" y="543" text-anchor="middle" class="label">x̂₀ · generated</text>
  </g>
  <text x="850" y="587" class="small">Training samples a random t; sampling traverses the chain from T → 0.</text>
</svg>
