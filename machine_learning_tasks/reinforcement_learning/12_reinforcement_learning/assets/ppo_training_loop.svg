<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">PPO on-policy training loop</title>
  <desc id="desc">The current actor critic interacts with CartPole, stores fresh transitions, estimates advantages, and updates on minibatches before collecting new data.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#334155"/></marker>
    <style>
      .title{font:700 27px system-ui,'Noto Sans CJK SC',sans-serif;fill:#102a43}.label{font:700 17px system-ui,'Noto Sans CJK SC',sans-serif;fill:#102a43}.small{font:500 14px system-ui,'Noto Sans CJK SC',sans-serif;fill:#475569}.tag{font:600 13px system-ui,'Noto Sans CJK SC',sans-serif;fill:#334155}
    </style>
  </defs>
  <rect width="1200" height="520" rx="16" fill="#f6f9fc"/>
  <text x="48" y="52" class="title">PPO：用当前策略采样，再用这批数据做有限更新</text>
  <rect x="55" y="130" width="240" height="115" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="175" y="169" text-anchor="middle" class="label">Actor-Critic</text><text x="175" y="198" text-anchor="middle" class="small">πθ(a|s) 与 V(s)</text>
  <rect x="475" y="130" width="240" height="115" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="595" y="169" text-anchor="middle" class="label">CartPole 环境</text><text x="595" y="198" text-anchor="middle" class="small">执行动作，返回状态与奖励</text>
  <path d="M295 160H465" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><text x="380" y="148" text-anchor="middle" class="tag">动作 aₜ</text>
  <path d="M475 220H305" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><text x="390" y="243" text-anchor="middle" class="tag">状态 sₜ₊₁、奖励 rₜ</text>
  <path d="M595 245V310" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="445" y="315" width="300" height="92" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="595" y="351" text-anchor="middle" class="label">Rollout Buffer</text><text x="595" y="379" text-anchor="middle" class="small">(sₜ, aₜ, rₜ, Vₜ, log πold, done)</text>
  <path d="M745 360H805" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="815" y="315" width="155" height="92" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="892" y="351" text-anchor="middle" class="label">GAE</text><text x="892" y="379" text-anchor="middle" class="small">Aₜ 与 Rₜ</text>
  <path d="M970 360H1010" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="1020" y="315" width="145" height="92" rx="12" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/>
  <text x="1092" y="351" text-anchor="middle" class="label">PPO 更新</text><text x="1092" y="379" text-anchor="middle" class="small">打乱并分小批</text>
  <path d="M1090 315V92H175V120" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="630" y="82" text-anchor="middle" class="small">更新策略参数后，丢弃旧 rollout 并重新采样（On-Policy）</text>
</svg>
