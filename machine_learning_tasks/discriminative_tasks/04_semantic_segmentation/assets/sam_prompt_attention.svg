<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="560" viewBox="0 0 1250 560" role="img" aria-labelledby="title desc">
  <title id="title">SAM 提示驱动分割</title><desc id="desc">展示 SAM 图像编码器、提示编码器、双向注意力和掩码解码器的交互。</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#315b78"/></marker><style>.t{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif}.title{font-size:30px;font-weight:700;fill:#fff}.h{font-size:19px;font-weight:700;fill:#123b56}.b{font-size:16px;fill:#314b5c}.s{font-size:14px;fill:#526b78}</style></defs>
  <rect width="1250" height="560" fill="#f7fafb"/><rect width="1250" height="78" fill="#123b56"/><text x="40" y="50" class="t title">SAM：图像与提示在注意力中交互生成掩码</text>
  <g class="t" text-anchor="middle"><rect x="40" y="180" width="170" height="90" rx="12" fill="#d9eef0" stroke="#6d9baa" stroke-width="2"/><text x="125" y="218" class="h">输入图像</text><text x="125" y="245" class="s">B×3×256×256</text><path d="M210 225H265" stroke="#315b78" stroke-width="3" marker-end="url(#a)"/><rect x="275" y="160" width="210" height="130" rx="12" fill="#e9e4f7" stroke="#8675b3" stroke-width="2"/><text x="380" y="198" class="h">Image Encoder ViT</text><text x="380" y="230" class="b">Patch Embedding</text><text x="380" y="258" class="s">image embeddings</text><path d="M485 225H535" stroke="#315b78" stroke-width="3" marker-end="url(#a)"/>
  <rect x="40" y="365" width="170" height="90" rx="12" fill="#fff0e6" stroke="#ee8d4f" stroke-width="2"/><text x="125" y="403" class="h">点 / 框 / 掩码提示</text><text x="125" y="430" class="s">Prompt [N,2] 等</text><path d="M210 410H450V330H535" fill="none" stroke="#315b78" stroke-width="3" marker-end="url(#a)"/><rect x="545" y="190" width="245" height="170" rx="12" fill="#fff0e6" stroke="#ee8d4f" stroke-width="2"/><text x="667" y="228" class="h">Prompt Encoder</text><text x="667" y="260" class="b">位置编码 + 类型嵌入</text><text x="667" y="290" class="s">Sparse / Dense Embeddings</text><path d="M790 275H845" stroke="#315b78" stroke-width="3" marker-end="url(#a)"/>
  <rect x="855" y="190" width="210" height="170" rx="12" fill="#d9eef0" stroke="#6d9baa" stroke-width="2"/><text x="960" y="228" class="h">Two-Way Attention</text><text x="960" y="262" class="b">Tokens ↔ Image</text><text x="960" y="294" class="s">自注意力 + 交叉注意力</text><path d="M1065 275H1110" stroke="#315b78" stroke-width="3" marker-end="url(#a)"/><rect x="1120" y="205" width="100" height="110" rx="12" fill="#e9e4f7" stroke="#8675b3" stroke-width="2"/><text x="1170" y="245" class="h">Mask</text><text x="1170" y="275" class="h">Decoder</text></g>
  <path d="M1170 315V405H960" fill="none" stroke="#315b78" stroke-width="3" marker-end="url(#a)"/><rect x="805" y="390" width="315" height="72" rx="12" fill="#fff" stroke="#d7e4e9" stroke-width="2"/><text x="962" y="420" text-anchor="middle" class="t h">输出掩码 + IoU 质量分数</text><text x="962" y="445" text-anchor="middle" class="t s">上采样到原图分辨率</text>
</svg>
