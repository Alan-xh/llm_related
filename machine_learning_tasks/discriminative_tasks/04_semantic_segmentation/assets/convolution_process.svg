<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">卷积计算过程与维度变化</title>
  <desc id="desc">展示三乘三卷积核在五乘五特征图上的滑动计算、卷积公式，以及 U-Net 中张量维度的变化。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#315b78"/>
    </marker>
    <linearGradient id="header" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#123b56"/>
      <stop offset="1" stop-color="#1e6e78"/>
    </linearGradient>
    <style>
      .sans { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
      .title { font-size: 34px; font-weight: 700; fill: #ffffff; }
      .section { font-size: 24px; font-weight: 700; fill: #123b56; }
      .label { font-size: 18px; font-weight: 700; fill: #123b56; }
      .body { font-size: 17px; fill: #314b5c; }
      .small { font-size: 15px; fill: #526b78; }
      .formula { font-size: 23px; fill: #123b56; }
      .dim { font-size: 21px; font-weight: 700; fill: #123b56; }
      .cell { stroke: #ffffff; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="#f7fafb"/>
  <rect x="0" y="0" width="1600" height="92" fill="url(#header)"/>
  <text x="64" y="58" class="sans title">卷积层：局部感受野、计算公式与维度变化</text>
  <text x="1518" y="57" text-anchor="end" class="sans" font-size="16" fill="#d8edf0">U-Net / B × C × H × W</text>

  <rect x="44" y="120" width="1512" height="392" rx="14" fill="#ffffff" stroke="#d7e4e9" stroke-width="2"/>
  <text x="76" y="163" class="sans section">1. 单通道 3×3 卷积：滑动窗口与加权求和</text>
  <text x="76" y="194" class="sans body">卷积核每次覆盖输入的一个局部区域，逐元素相乘后求和，得到输出特征图中的一个像素。</text>

  <!-- Input grid -->
  <text x="118" y="238" class="sans label">输入特征图 X（5×5）</text>
  <g transform="translate(92 255)">
    <rect width="240" height="240" rx="6" fill="#e7f2f5" stroke="#6d9baa" stroke-width="2"/>
    <g class="sans" font-size="18" text-anchor="middle" dominant-baseline="middle">
      <rect x="0" y="0" width="144" height="144" fill="#c7e6e9" stroke="#ee8d4f" stroke-width="5"/>
      <g fill="#315b78" class="cell">
        <rect x="0" y="0" width="48" height="48"/><rect x="48" y="0" width="48" height="48"/><rect x="96" y="0" width="48" height="48"/>
        <rect x="144" y="0" width="48" height="48"/><rect x="192" y="0" width="48" height="48"/>
        <rect x="0" y="48" width="48" height="48"/><rect x="48" y="48" width="48" height="48"/><rect x="96" y="48" width="48" height="48"/>
        <rect x="144" y="48" width="48" height="48"/><rect x="192" y="48" width="48" height="48"/>
        <rect x="0" y="96" width="48" height="48"/><rect x="48" y="96" width="48" height="48"/><rect x="96" y="96" width="48" height="48"/>
        <rect x="144" y="96" width="48" height="48"/><rect x="192" y="96" width="48" height="48"/>
        <rect x="0" y="144" width="48" height="48"/><rect x="48" y="144" width="48" height="48"/><rect x="96" y="144" width="48" height="48"/>
        <rect x="144" y="144" width="48" height="48"/><rect x="192" y="144" width="48" height="48"/>
        <rect x="0" y="192" width="48" height="48"/><rect x="48" y="192" width="48" height="48"/><rect x="96" y="192" width="48" height="48"/>
        <rect x="144" y="192" width="48" height="48"/><rect x="192" y="192" width="48" height="48"/>
      </g>
      <g fill="#ffffff">
        <text x="24" y="24">1</text><text x="72" y="24">2</text><text x="120" y="24">1</text><text x="168" y="24">0</text><text x="216" y="24">1</text>
        <text x="24" y="72">0</text><text x="72" y="72">1</text><text x="120" y="72">2</text><text x="168" y="72">1</text><text x="216" y="72">0</text>
        <text x="24" y="120">2</text><text x="72" y="120">1</text><text x="120" y="120">0</text><text x="168" y="120">1</text><text x="216" y="120">2</text>
        <text x="24" y="168">1</text><text x="72" y="168">0</text><text x="120" y="168">1</text><text x="168" y="168">2</text><text x="216" y="168">1</text>
        <text x="24" y="216">0</text><text x="72" y="216">1</text><text x="120" y="216">2</text><text x="168" y="216">0</text><text x="216" y="216">1</text>
      </g>
    </g>
  </g>
  <text x="212" y="505" text-anchor="middle" class="sans small" fill="#d46e36">橙框：当前 3×3 感受野</text>

  <!-- Kernel -->
  <path d="M354 375 L442 375" stroke="#315b78" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="396" y="354" text-anchor="middle" class="sans small">逐元素相乘</text>
  <text x="477" y="238" class="sans label">卷积核 K（3×3）</text>
  <g transform="translate(448 255)">
    <rect width="144" height="144" rx="6" fill="#fff0e6" stroke="#ee8d4f" stroke-width="3"/>
    <g fill="#d9783d" stroke="#ffffff" stroke-width="2" class="sans" font-size="19" text-anchor="middle" dominant-baseline="middle">
      <rect x="0" y="0" width="48" height="48"/><rect x="48" y="0" width="48" height="48"/><rect x="96" y="0" width="48" height="48"/>
      <rect x="0" y="48" width="48" height="48"/><rect x="48" y="48" width="48" height="48"/><rect x="96" y="48" width="48" height="48"/>
      <rect x="0" y="96" width="48" height="48"/><rect x="48" y="96" width="48" height="48"/><rect x="96" y="96" width="48" height="48"/>
      <text x="24" y="24" fill="#ffffff">1</text><text x="72" y="24" fill="#ffffff">0</text><text x="120" y="24" fill="#ffffff">−1</text>
      <text x="24" y="72" fill="#ffffff">1</text><text x="72" y="72" fill="#ffffff">0</text><text x="120" y="72" fill="#ffffff">−1</text>
      <text x="24" y="120" fill="#ffffff">1</text><text x="72" y="120" fill="#ffffff">0</text><text x="120" y="120" fill="#ffffff">−1</text>
    </g>
  </g>

  <!-- Calculation -->
  <path d="M608 375 L686 375" stroke="#315b78" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="647" y="354" text-anchor="middle" class="sans small">求和 + 偏置</text>
  <rect x="694" y="255" width="378" height="144" rx="8" fill="#f2f7f8" stroke="#b8d0d7" stroke-width="2"/>
  <text x="720" y="287" class="sans label">左上角输出像素</text>
  <text x="720" y="326" class="mono formula">y₀₀ = 1×1 + 2×0 + 1×(−1)</text>
  <text x="720" y="362" class="mono formula">     + 0×1 + 1×0 + 2×(−1)</text>
  <text x="720" y="389" class="mono formula">     + 2×1 + 1×0 + 0×(−1) + b = 0 + b</text>

  <!-- Output -->
  <path d="M1088 375 L1166 375" stroke="#315b78" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1127" y="354" text-anchor="middle" class="sans small">滑动得到</text>
  <text x="1195" y="238" class="sans label">输出特征图 Y（3×3）</text>
  <g transform="translate(1192 275)">
    <rect width="180" height="180" rx="6" fill="#dff0ed" stroke="#4d988d" stroke-width="2"/>
    <g fill="#3c8d82" stroke="#ffffff" stroke-width="2" class="sans" font-size="20" text-anchor="middle" dominant-baseline="middle">
      <rect x="0" y="0" width="60" height="60"/><rect x="60" y="0" width="60" height="60"/><rect x="120" y="0" width="60" height="60"/>
      <rect x="0" y="60" width="60" height="60"/><rect x="60" y="60" width="60" height="60"/><rect x="120" y="60" width="60" height="60"/>
      <rect x="0" y="120" width="60" height="60"/><rect x="60" y="120" width="60" height="60"/><rect x="120" y="120" width="60" height="60"/>
      <text x="30" y="30" fill="#ffffff">0</text><text x="90" y="30" fill="#ffffff">−2</text><text x="150" y="30" fill="#ffffff">1</text>
      <text x="30" y="90" fill="#ffffff">1</text><text x="90" y="90" fill="#ffffff">−1</text><text x="150" y="90" fill="#ffffff">0</text>
      <text x="30" y="150" fill="#ffffff">2</text><text x="90" y="150" fill="#ffffff">0</text><text x="150" y="150" fill="#ffffff">−1</text>
    </g>
  </g>
  <text x="1282" y="486" text-anchor="middle" class="sans small">无 padding、步幅 S=1：空间尺寸 5×5 → 3×3</text>

  <rect x="44" y="540" width="1512" height="378" rx="14" fill="#ffffff" stroke="#d7e4e9" stroke-width="2"/>
  <text x="76" y="583" class="sans section">2. U-Net 中的张量维度追踪（B、C、H、W）</text>
  <text x="76" y="614" class="sans body">以文档配置 B=8、输入通道 Cᵢₙ=3、基础通道 32 为例：3×3 卷积配合 padding=1 保持 H、W。</text>

  <!-- Dimension flow -->
  <rect x="76" y="650" width="284" height="102" rx="10" fill="#e7f2f5" stroke="#8eb4be" stroke-width="2"/>
  <text x="218" y="685" text-anchor="middle" class="sans label">输入特征图</text>
  <text x="218" y="724" text-anchor="middle" class="mono dim">[8, 3, 128, 128]</text>

  <path d="M372 701 L436 701" stroke="#315b78" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="447" y="630" width="282" height="144" rx="10" fill="#fff0e6" stroke="#e6a06f" stroke-width="2"/>
  <text x="588" y="662" text-anchor="middle" class="sans label">Conv2d</text>
  <text x="588" y="696" text-anchor="middle" class="mono body">K=3, S=1, P=1</text>
  <text x="588" y="731" text-anchor="middle" class="sans small">Cᵢₙ=3 → Cₒᵤₜ=32</text>
  <text x="588" y="758" text-anchor="middle" class="sans small">32 个可学习卷积核</text>

  <path d="M741 701 L805 701" stroke="#315b78" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="816" y="650" width="284" height="102" rx="10" fill="#dff0ed" stroke="#83b9af" stroke-width="2"/>
  <text x="958" y="685" text-anchor="middle" class="sans label">卷积输出</text>
  <text x="958" y="724" text-anchor="middle" class="mono dim">[8, 32, 128, 128]</text>

  <path d="M1112 701 L1176 701" stroke="#315b78" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1187" y="630" width="326" height="144" rx="10" fill="#f2f7f8" stroke="#b8d0d7" stroke-width="2"/>
  <text x="1350" y="662" text-anchor="middle" class="sans label">MaxPool2d（2×2）</text>
  <text x="1350" y="698" text-anchor="middle" class="sans small">H、W 各减半，C 不变</text>
  <text x="1350" y="740" text-anchor="middle" class="mono dim">[8, 32, 64, 64]</text>

  <!-- Formula strip -->
  <rect x="76" y="807" width="1437" height="78" rx="10" fill="#123b56"/>
  <text x="105" y="840" class="sans" font-size="18" fill="#cfe8eb">空间尺寸公式</text>
  <text x="322" y="847" class="mono" font-size="25" fill="#ffffff">Hₒᵤₜ = ⌊(Hᵢₙ + 2P − K) / S⌋ + 1</text>
  <text x="904" y="840" class="sans" font-size="17" fill="#cfe8eb">示例：⌊(128 + 2×1 − 3) / 1⌋ + 1 = 128</text>
  <text x="904" y="865" class="sans" font-size="15" fill="#a9d0d4">P=1 抵消 K=3 带来的边缘缩小，因此卷积只改变通道数。</text>

  <text x="76" y="949" class="sans small">要点：卷积核数量决定输出通道 Cₒᵤₜ；K、S、P 决定空间尺寸 H、W；U-Net 的 DoubleConv 通常连续执行两次 3×3 卷积。</text>
</svg>
