<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="560" viewBox="0 0 1250 560" role="img" aria-labelledby="title desc">
  <title id="title">Faster R-CNN 两阶段检测流程</title><desc id="desc">展示 backbone、RPN 生成候选框、NMS、RoI Pooling 与检测头的两阶段结构。</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#315b78"/></marker><style>.t{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif}.title{font-size:30px;font-weight:700;fill:#fff}.h{font-size:19px;font-weight:700;fill:#123b56}.b{font-size:16px;fill:#314b5c}.s{font-size:14px;fill:#526b78}</style></defs>
  <rect width="1250" height="560" fill="#f7fafb"/><rect width="1250" height="78" fill="#123b56"/><text x="40" y="50" class="t title">Faster R-CNN：共享特征上的两阶段检测</text>
  <g class="t" text-anchor="middle"><rect x="35" y="205" width="150" height="82" rx="12" fill="#d9eef0" stroke="#6d9baa" stroke-width="2"/><text x="110" y="240" class="h">输入图像</text><text x="110" y="265" class="s">B×3×H×W</text><path d="M185 246H235" stroke="#315b78" stroke-width="3" marker-end="url(#a)"/><rect x="245" y="190" width="180" height="112" rx="12" fill="#e9e4f7" stroke="#8675b3" stroke-width="2"/><text x="335" y="228" class="h">Backbone</text><text x="335" y="258" class="b">多尺度卷积特征</text><text x="335" y="282" class="s">B×256×H/16×W/16</text>
  <path d="M425 246H490" stroke="#315b78" stroke-width="3" marker-end="url(#a)"/><rect x="500" y="130" width="215" height="100" rx="12" fill="#fff0e6" stroke="#ee8d4f" stroke-width="2"/><text x="607" y="168" class="h">阶段 1：RPN</text><text x="607" y="198" class="b">Anchors → cls / box</text><path d="M425 246H470V180H490" fill="none" stroke="#315b78" stroke-width="3" marker-end="url(#a)"/><rect x="500" y="270" width="215" height="100" rx="12" fill="#fff0e6" stroke="#ee8d4f" stroke-width="2"/><text x="607" y="308" class="h">候选框筛选</text><text x="607" y="338" class="b">Decode → NMS → Top-K</text>
  <path d="M715 320H775" stroke="#315b78" stroke-width="3" marker-end="url(#a)"/><rect x="785" y="270" width="185" height="100" rx="12" fill="#d9eef0" stroke="#6d9baa" stroke-width="2"/><text x="877" y="308" class="h">RoI Pooling</text><text x="877" y="338" class="s">每个 RoI → 7×7</text><path d="M970 320H1030" stroke="#315b78" stroke-width="3" marker-end="url(#a)"/><rect x="1040" y="205" width="175" height="82" rx="12" fill="#e9e4f7" stroke="#8675b3" stroke-width="2"/><text x="1127" y="240" class="h">阶段 2：Head</text><text x="1127" y="265" class="s">分类 + 框精修</text></g>
  <path d="M877 270V150H1030" fill="none" stroke="#7d9aa5" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)"/><text x="885" y="137" class="t s">共享特征图</text>
  <rect x="95" y="435" width="1060" height="72" rx="12" fill="#fff" stroke="#d7e4e9" stroke-width="2"/><text x="625" y="465" text-anchor="middle" class="t h">两阶段分工</text><text x="625" y="491" text-anchor="middle" class="t b">RPN 负责“哪里可能有物体”，第二阶段负责“是什么 + 边界框有多准”。</text>
</svg>
