<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">IoU 与 NMS</title><desc id="desc">展示两个框的交并比计算，以及按置信度进行非极大值抑制的过程。</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#315b78"/></marker><style>.t{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif}.title{font-size:30px;font-weight:700;fill:#fff}.h{font-size:20px;font-weight:700;fill:#123b56}.b{font-size:17px;fill:#314b5c}.s{font-size:15px;fill:#526b78}</style></defs>
  <rect width="1200" height="500" fill="#f7fafb"/><rect width="1200" height="78" fill="#123b56"/><text x="40" y="50" class="t title">候选框质量：IoU 衡量重叠，NMS 去除重复</text>
  <rect x="45" y="112" width="500" height="300" rx="14" fill="#fff" stroke="#d7e4e9" stroke-width="2"/><text x="295" y="150" text-anchor="middle" class="t h">IoU：两个框的交并比</text><rect x="130" y="190" width="260" height="160" fill="#d9eef0" stroke="#31808b" stroke-width="4"/><rect x="220" y="230" width="260" height="160" fill="#fff0e6" fill-opacity=".85" stroke="#ee8d4f" stroke-width="4"/><text x="270" y="270" class="t b">交集</text><text x="295" y="382" text-anchor="middle" class="t s">IoU = Area(A∩B) / Area(A∪B)</text>
  <path d="M545 260H625" stroke="#315b78" stroke-width="3" marker-end="url(#a)"/><rect x="635" y="112" width="520" height="300" rx="14" fill="#fff" stroke="#d7e4e9" stroke-width="2"/><text x="895" y="150" text-anchor="middle" class="t h">NMS：按分数迭代抑制</text><g class="t"><rect x="680" y="184" width="135" height="48" rx="8" fill="#d9eef0"/><text x="748" y="214" text-anchor="middle" class="b">框 A · 0.95</text><rect x="840" y="184" width="135" height="48" rx="8" fill="#fff0e6"/><text x="908" y="214" text-anchor="middle" class="b">框 B · 0.88</text><rect x="1000" y="184" width="110" height="48" rx="8" fill="#e9e4f7"/><text x="1055" y="214" text-anchor="middle" class="b">框 C · 0.61</text><path d="M748 250V285H908V250" fill="none" stroke="#ee8d4f" stroke-width="3" marker-end="url(#a)"/><text x="828" y="305" text-anchor="middle" class="s">IoU(A,B) &gt; 阈值 → 抑制 B</text><path d="M908 333H1055" stroke="#315b78" stroke-width="3" marker-end="url(#a)"/><text x="982" y="360" text-anchor="middle" class="s">保留 A、C</text></g>
  <text x="600" y="458" text-anchor="middle" class="t b">NMS 不改变框的位置，只在高度重叠的候选框中保留置信度最高者。</text>
</svg>
