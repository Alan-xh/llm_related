<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">表格特征序列化与全局池化</title><desc id="desc">展示 Mamba 回归模型将每个标量特征视为 token，映射到隐空间并通过平均池化得到样本表示。</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#315b78"/></marker><style>.t{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif}.title{font-size:30px;font-weight:700;fill:#fff}.h{font-size:20px;font-weight:700;fill:#123b56}.b{font-size:17px;fill:#314b5c}.s{font-size:15px;fill:#526b78}</style></defs>
  <rect width="1200" height="500" fill="#f7fafb"/><rect width="1200" height="78" fill="#123b56"/><text x="40" y="50" class="t title">Mamba 回归：把多维表格特征变成可扫描的序列</text>
  <text x="55" y="135" class="t h">原始样本</text><g class="t" text-anchor="middle"><rect x="50" y="155" width="110" height="58" rx="8" fill="#d9eef0"/><text x="105" y="191" class="b">f₁</text><rect x="175" y="155" width="110" height="58" rx="8" fill="#d9eef0"/><text x="230" y="191" class="b">f₂</text><rect x="300" y="155" width="110" height="58" rx="8" fill="#d9eef0"/><text x="355" y="191" class="b">…</text><rect x="425" y="155" width="110" height="58" rx="8" fill="#d9eef0"/><text x="480" y="191" class="b">f_D</text></g>
  <path d="M535 184H625" stroke="#315b78" stroke-width="3" marker-end="url(#a)"/><rect x="635" y="125" width="230" height="120" rx="12" fill="#fff0e6" stroke="#ee8d4f" stroke-width="2"/><text x="750" y="160" text-anchor="middle" class="t h">Tokenization</text><text x="750" y="195" text-anchor="middle" class="t b">unsqueeze → Linear</text><text x="750" y="222" text-anchor="middle" class="t s">[B,D] → [B,D,Dₘₒdₑₗ]</text>
  <path d="M865 184H955" stroke="#315b78" stroke-width="3" marker-end="url(#a)"/><rect x="965" y="125" width="180" height="120" rx="12" fill="#e9e4f7" stroke="#8675b3" stroke-width="2"/><text x="1055" y="160" text-anchor="middle" class="t h">Mamba Blocks</text><text x="1055" y="195" text-anchor="middle" class="t b">沿特征序列扫描</text><text x="1055" y="222" text-anchor="middle" class="t s">保留跨特征依赖</text>
  <path d="M1055 245V330" stroke="#315b78" stroke-width="3" marker-end="url(#a)"/><rect x="870" y="340" width="370" height="78" rx="12" fill="#d9eef0" stroke="#6d9baa" stroke-width="2"/><text x="1055" y="373" text-anchor="middle" class="t h">Global Mean Pooling</text><text x="1055" y="400" text-anchor="middle" class="t b">沿 D 维聚合 → [B,Dₘₒdₑₗ] → 回归头</text>
  <rect x="55" y="330" width="730" height="88" rx="12" fill="#fff" stroke="#d7e4e9" stroke-width="2"/><text x="420" y="366" text-anchor="middle" class="t h">关键直觉</text><text x="420" y="396" text-anchor="middle" class="t b">每一列特征都成为一个“位置”，Mamba 能建模特征之间的顺序依赖。</text>
</svg>
