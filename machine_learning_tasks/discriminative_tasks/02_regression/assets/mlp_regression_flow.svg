<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">MLP 回归数据流</title><desc id="desc">展示多层感知机中线性层、层归一化、SiLU、Dropout 与回归头的作用。</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#315b78"/></marker><style>.t{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif}.title{font-size:30px;font-weight:700;fill:#fff}.h{font-size:19px;font-weight:700;fill:#123b56}.b{font-size:16px;fill:#314b5c}.s{font-size:14px;fill:#526b78}</style></defs>
  <rect width="1200" height="500" fill="#f7fafb"/><rect width="1200" height="78" fill="#123b56"/><text x="40" y="50" class="t title">MLP 回归：从特征向量到连续值预测</text>
  <g class="t" text-anchor="middle"><rect x="45" y="180" width="145" height="80" rx="12" fill="#d9eef0" stroke="#6d9baa" stroke-width="2"/><text x="117" y="216" class="h">输入特征 x</text><text x="117" y="242" class="s">[B, Dᵢₙ]</text><path d="M190 220H245" stroke="#315b78" stroke-width="3" marker-end="url(#a)"/>
  <rect x="255" y="155" width="170" height="130" rx="12" fill="#fff0e6" stroke="#ee8d4f" stroke-width="2"/><text x="340" y="185" class="h">MLPBlock × N</text><text x="340" y="215" class="b">Linear</text><text x="340" y="240" class="b">LayerNorm → SiLU</text><text x="340" y="265" class="b">Dropout</text><path d="M425 220H480" stroke="#315b78" stroke-width="3" marker-end="url(#a)"/>
  <rect x="490" y="155" width="170" height="130" rx="12" fill="#e9e4f7" stroke="#8675b3" stroke-width="2"/><text x="575" y="190" class="h">隐藏表示</text><text x="575" y="225" class="b">[B, Dₕᵢddₑₙ]</text><text x="575" y="260" class="s">非线性特征组合</text><path d="M660 220H715" stroke="#315b78" stroke-width="3" marker-end="url(#a)"/>
  <rect x="725" y="175" width="170" height="90" rx="12" fill="#fff0e6" stroke="#ee8d4f" stroke-width="2"/><text x="810" y="212" class="h">Regression Head</text><text x="810" y="240" class="b">Linear → ŷ</text><path d="M895 220H950" stroke="#315b78" stroke-width="3" marker-end="url(#a)"/>
  <rect x="960" y="180" width="180" height="80" rx="12" fill="#d9eef0" stroke="#6d9baa" stroke-width="2"/><text x="1050" y="216" class="h">连续值输出</text><text x="1050" y="242" class="s">[B, Dₒᵤₜ]</text></g>
  <rect x="80" y="355" width="1040" height="70" rx="12" fill="#fff" stroke="#d7e4e9" stroke-width="2"/><text x="600" y="385" text-anchor="middle" class="t h">训练目标：MSE = 1/N · Σ(y − ŷ)²</text><text x="600" y="408" text-anchor="middle" class="t b">隐藏层负责学习非线性关系；最后一层不加激活，允许输出任意实数。</text>
</svg>
