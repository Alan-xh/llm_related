<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Mamba 选择性扫描</title><desc id="desc">展示 Mamba 逐 token 产生 Delta、B、C 参数并递归更新隐状态。</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#315b78"/></marker><style>.t{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif}.title{font-size:30px;font-weight:700;fill:#fff}.h{font-size:21px;font-weight:700;fill:#123b56}.b{font-size:17px;fill:#314b5c}.s{font-size:15px;fill:#526b78}</style></defs>
  <rect width="1200" height="560" fill="#f7fafb"/><rect width="1200" height="78" fill="#123b56"/><text x="40" y="50" class="t title">Mamba S6：输入驱动的选择性状态空间扫描</text>
  <text x="55" y="120" class="t h">Token 序列</text><g class="t h" text-anchor="middle"><rect x="55" y="140" width="120" height="58" rx="9" fill="#d9eef0"/><text x="115" y="176">x₁</text><rect x="195" y="140" width="120" height="58" rx="9" fill="#d9eef0"/><text x="255" y="176">x₂</text><rect x="335" y="140" width="120" height="58" rx="9" fill="#d9eef0"/><text x="395" y="176">…</text><rect x="475" y="140" width="120" height="58" rx="9" fill="#d9eef0"/><text x="535" y="176">xₜ</text></g>
  <path d="M115 198V250M255 198V250M395 198V250M535 198V250" stroke="#315b78" stroke-width="3" marker-end="url(#a)"/><rect x="55" y="262" width="540" height="72" rx="12" fill="#fff0e6" stroke="#ee8d4f" stroke-width="2"/><text x="325" y="292" text-anchor="middle" class="t h">选择性参数投影</text><text x="325" y="318" text-anchor="middle" class="t b">Δₜ（步长）、Bₜ（写入）、Cₜ（读出）</text>
  <path d="M595 298H670" stroke="#315b78" stroke-width="3" marker-end="url(#a)"/><rect x="680" y="235" width="250" height="128" rx="12" fill="#e9e4f7" stroke="#8675b3" stroke-width="2"/><text x="805" y="270" text-anchor="middle" class="t h">状态递推</text><text x="805" y="304" text-anchor="middle" class="t b">hₜ = Āₜhₜ₋₁ + B̄ₜxₜ</text><text x="805" y="336" text-anchor="middle" class="t b">yₜ = Cₜhₜ + Dxₜ</text>
  <path d="M930 299H1005" stroke="#315b78" stroke-width="3" marker-end="url(#a)"/><rect x="1015" y="262" width="135" height="72" rx="12" fill="#d9eef0" stroke="#6d9baa" stroke-width="2"/><text x="1082" y="306" text-anchor="middle" class="t h">输出 yₜ</text>
  <path d="M805 365V440H395V365" fill="none" stroke="#7d9aa5" stroke-width="3" marker-end="url(#a)"/><text x="600" y="430" text-anchor="middle" class="t s">扫描到下一个 token，保留有用历史、过滤无关信息</text>
  <rect x="75" y="470" width="1050" height="52" rx="10" fill="#fff" stroke="#d7e4e9" stroke-width="2"/><text x="600" y="503" text-anchor="middle" class="t b">与固定参数 SSM 不同：Δ、B、C 随输入变化，因此模型能“选择性记忆”。</text>
</svg>
