<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">ResNet 残差连接</title>
  <desc id="desc">输入特征分成残差变换分支和捷径分支，经过逐元素相加与激活得到输出。</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#315b78"/></marker><style>
    .t{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif}.title{font-size:30px;font-weight:700;fill:#fff}.h{font-size:21px;font-weight:700;fill:#123b56}.b{font-size:18px;fill:#314b5c}.s{font-size:16px;fill:#526b78}
  </style></defs>
  <rect width="1200" height="520" fill="#f7fafb"/><rect width="1200" height="78" fill="#123b56"/>
  <text x="40" y="50" class="t title">ResNet BasicBlock：残差学习为什么更容易优化</text>
  <rect x="42" y="112" width="200" height="70" rx="12" fill="#d9eef0" stroke="#6d9baa" stroke-width="2"/><text x="142" y="154" text-anchor="middle" class="t h">输入 x</text><text x="142" y="176" text-anchor="middle" class="t s">[B,C,H,W]</text>
  <path d="M242 147H305" stroke="#315b78" stroke-width="3" marker-end="url(#a)"/>
  <rect x="315" y="102" width="300" height="90" rx="12" fill="#fff0e6" stroke="#ee8d4f" stroke-width="2"/><text x="465" y="138" text-anchor="middle" class="t h">残差分支 F(x)</text><text x="465" y="168" text-anchor="middle" class="t b">Conv → BN → ReLU → Conv → BN</text>
  <path d="M242 147V300H780" fill="none" stroke="#7d9aa5" stroke-width="3" marker-end="url(#a)"/><text x="390" y="286" class="t s">捷径分支：恒等映射（或 1×1 Conv 调整维度）</text>
  <path d="M615 147H780V300" fill="none" stroke="#315b78" stroke-width="3" marker-end="url(#a)"/>
  <circle cx="780" cy="300" r="34" fill="#f4c95d" stroke="#bf8d15" stroke-width="3"/><text x="780" y="308" text-anchor="middle" class="t" font-size="30" font-weight="700" fill="#6c4b00">＋</text>
  <path d="M814 300H910" stroke="#315b78" stroke-width="3" marker-end="url(#a)"/><rect x="920" y="265" width="190" height="70" rx="12" fill="#d9eef0" stroke="#6d9baa" stroke-width="2"/><text x="1015" y="307" text-anchor="middle" class="t h">ReLU 输出 y</text>
  <rect x="85" y="390" width="1030" height="86" rx="12" fill="#fff" stroke="#d7e4e9" stroke-width="2"/><text x="600" y="425" text-anchor="middle" class="t h">核心公式： y = ReLU(F(x) + Wₛx)</text><text x="600" y="454" text-anchor="middle" class="t b">网络只需学习“相对输入的增量” F(x)，梯度可沿捷径直接传播。</text>
</svg>
