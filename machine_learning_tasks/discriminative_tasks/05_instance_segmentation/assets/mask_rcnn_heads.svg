<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="560" viewBox="0 0 1250 560" role="img" aria-labelledby="title desc">
  <title id="title">Mask R-CNN 多分支预测</title><desc id="desc">展示共享骨干和 RoI 特征如何分流到分类、边界框回归与掩码三个预测头。</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#315b78"/></marker><style>.t{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif}.title{font-size:30px;font-weight:700;fill:#fff}.h{font-size:20px;font-weight:700;fill:#123b56}.b{font-size:17px;fill:#314b5c}.s{font-size:15px;fill:#526b78}</style></defs>
  <rect width="1250" height="560" fill="#f7fafb"/><rect width="1250" height="78" fill="#123b56"/><text x="40" y="50" class="t title">Mask R-CNN：同一 RoI 的分类、定位与像素级分割</text>
  <g class="t" text-anchor="middle"><rect x="45" y="215" width="165" height="90" rx="12" fill="#d9eef0" stroke="#6d9baa" stroke-width="2"/><text x="127" y="252" class="h">共享 Backbone</text><text x="127" y="278" class="s">Feature Pyramid / 特征图</text><path d="M210 260H270" stroke="#315b78" stroke-width="3" marker-end="url(#a)"/><rect x="280" y="215" width="190" height="90" rx="12" fill="#fff0e6" stroke="#ee8d4f" stroke-width="2"/><text x="375" y="252" class="h">RPN + RoIAlign</text><text x="375" y="278" class="s">统一为 7×7 RoI 特征</text><path d="M470 260H560" stroke="#315b78" stroke-width="3" marker-end="url(#a)"/><circle cx="580" cy="260" r="27" fill="#f4c95d" stroke="#bf8d15" stroke-width="3"/><text x="580" y="268" class="t" font-size="27" font-weight="700" fill="#6c4b00">分</text>
  <path d="M580 233V145H650" fill="none" stroke="#315b78" stroke-width="3" marker-end="url(#a)"/><path d="M607 260H650" stroke="#315b78" stroke-width="3" marker-end="url(#a)"/><path d="M580 287V375H650" fill="none" stroke="#315b78" stroke-width="3" marker-end="url(#a)"/>
  <rect x="660" y="100" width="230" height="90" rx="12" fill="#e9e4f7" stroke="#8675b3" stroke-width="2"/><text x="775" y="137" class="h">分类分支</text><text x="775" y="166" class="b">类别 logits / score</text><rect x="660" y="215" width="230" height="90" rx="12" fill="#e9e4f7" stroke="#8675b3" stroke-width="2"/><text x="775" y="252" class="h">Box 分支</text><text x="775" y="281" class="b">4×类别的偏移量</text><rect x="660" y="330" width="230" height="90" rx="12" fill="#e9e4f7" stroke="#8675b3" stroke-width="2"/><text x="775" y="367" class="h">Mask 分支</text><text x="775" y="396" class="b">类别特定 28×28 mask</text>
  <path d="M890 145H960M890 260H960M890 375H960" stroke="#315b78" stroke-width="3" marker-end="url(#a)"/><rect x="970" y="110" width="220" height="65" rx="10" fill="#d9eef0" stroke="#6d9baa" stroke-width="2"/><text x="1080" y="150" class="h">“是什么”</text><rect x="970" y="228" width="220" height="65" rx="10" fill="#d9eef0" stroke="#6d9baa" stroke-width="2"/><text x="1080" y="268" class="h">“在哪里”</text><rect x="970" y="345" width="220" height="65" rx="10" fill="#d9eef0" stroke="#6d9baa" stroke-width="2"/><text x="1080" y="385" class="h">“像素轮廓”</text></g>
  <rect x="110" y="470" width="1030" height="54" rx="10" fill="#fff" stroke="#d7e4e9" stroke-width="2"/><text x="625" y="504" text-anchor="middle" class="t b">Mask 分支只对正 RoI 学习前景掩码，因此分类/定位与实例边界能够协同但互不混淆。</text>
</svg>
